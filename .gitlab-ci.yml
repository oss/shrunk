stages:
  - lint
  - build
  - test
  - promote

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/.npm/
    - .cache/pip

.images:
  parallel:
    matrix:
      - IMAGE: ["frontend", "backend", "shib-sp"]

.buildah:
  image: quay.io/buildah/stable:v1.43.5@sha256:a6f96bfffc47f36462985573d85e87f782bf2d8b37e02cb3dd307713bfa6cc13
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" --password $CI_REGISTRY_PASSWORD $CI_REGISTRY

.skopeo:
  image:
    name: quay.io/skopeo/stable:v1.22.3@sha256:2681eccb8b02c495b013c2669cbf7f41d5c0b0b0e644e7c69bd3ea9bcb20641f
    entrypoint: [""]
  stage: promote
  before_script:
    - skopeo login -u "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.mongo-service:
  services:
    - &mongo_service
      name: mongo:7.0.45-jammy@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
      alias: mongo
      command:
        - sh
        - -c
        - |
          replicaset() {
            while ! mongosh --eval 'db.version()' >/dev/null 2>/dev/null; do
              echo "mongo not ready... waiting..."
              sleep 1
            done
            echo "mongo version $(mongosh --eval 'db.version()') is ready..."
            echo "creating mongo replica set..."
            mongosh --eval 'rs.initiate()'
            mongosh --eval 'rs.conf()'
          }

          replicaset &
          exec mongod --bind_ip_all --replSet=rs0

eslint:
  stage: lint
  image: node:26.13.0-trixie@sha256:6c6f2679f5b655c7c6091a34b81372b5962ca9f25d897a501d613742f922567b
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx eslint --format=junit src > ../eslint.xml
  artifacts:
    reports:
      junit: eslint.xml

type-check:
  stage: lint
  image: node:26.13.0-trixie@sha256:6c6f2679f5b655c7c6091a34b81372b5962ca9f25d897a501d613742f922567b
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run type-check

react-doctor:
  stage: lint
  image: node:24.22.1-bookworm@sha256:d862bb5d082c5ae0210ac07e8c0344cb8cf7bef6d78e9b8c50c179da923108ea
  interruptible: true
  variables:
    CI: "true"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - when: never
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - |
      set -e
      base_ref="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch --no-tags origin "$base_ref"
      npm run react-doctor -- --scope changed --base FETCH_HEAD --blocking error --no-score --no-supply-chain

pylint:
  stage: lint
  image: python:3.14.10-trixie@sha256:22caa054c0d309b1eee6f448326a8821a674a75b98653247fe706db90491fc87
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    # Official uv PyPI Linux wheels; hashes verified against the 0.13.6 release.
    - &install_uv |
      python -m pip install --only-binary=:all: --no-deps --require-hashes -r /dev/stdin <<'EOF'
      uv==0.13.6 \
          --hash=sha256:7ec5486476d67a4214c460b5492393ee2300d84e1de17b293100a019b413568b \
          --hash=sha256:710c68ea4853aaf70ab2d0ccf2e147dee59449f035a1f8fe7759f087a31cdbf5 \
          --hash=sha256:d4d7026c7327dd11fc2c0d4bae4735ff6944293d370644f35d2e6e917cdcae04 \
          --hash=sha256:46c2ef1f744f20007be0cdd66db3022bb1ddcac477c754efda875e401a48d810 \
          --hash=sha256:b2d25a49d135a441f688a6869d6d8062fb6f0a2e3e32e18b72c9de1d0eb9521e \
          --hash=sha256:b9f57153fc98b7aa41dd6720e3de7578747f60b7bff22f50b76dcc47205bdde3 \
          --hash=sha256:22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba \
          --hash=sha256:2e9a99100abe4f99605366974c4f9fe27f236615e05de8e78c0f357e38f09f97 \
          --hash=sha256:1cd4b0a35fa599b83da5437748150319ae0917c522da60898327645382942faa \
          --hash=sha256:8542dcf118ce8a7cf2e4ba1fea7f5cc1638bc02b5b30dab1ead7e9034dc62fd3
      EOF
    - uv sync
    - uv run pylint --exit-zero --output-format=junit shrunk tests/*.py > pylint.xml
  artifacts:
    reports:
      junit: backend/pylint.xml

mypy:
  # stage: lint
  when: manual
  image: python:3.14.10-trixie@sha256:22caa054c0d309b1eee6f448326a8821a674a75b98653247fe706db90491fc87
  script:
    - cd backend
    - *install_uv
    - uv sync
    - uv run mypy --junit-xml=./mypy.xml .
  artifacts:
    reports:
      junit: mypy.xml

ruff-lint:
  stage: lint
  image: python:3.14.10-trixie@sha256:22caa054c0d309b1eee6f448326a8821a674a75b98653247fe706db90491fc87
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    - *install_uv
    - uv sync
    - uv run ruff check

ruff-format:
  stage: lint
  image: python:3.14.10-trixie@sha256:22caa054c0d309b1eee6f448326a8821a674a75b98653247fe706db90491fc87
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    - *install_uv
    - uv sync
    - uv run ruff format --check

prettier:
  stage: lint
  image: node:26.13.0-trixie@sha256:6c6f2679f5b655c7c6091a34b81372b5962ca9f25d897a501d613742f922567b
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx prettier --check .
  
build:
  extends:
    - .buildah
    - .images
  stage: build
  script:
    - mkdir -p .ci/image-digests
    - buildah build -t "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci"
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}"
        --label "edu.rutgers.shrunk.pipeline-iid=${CI_PIPELINE_IID}" ${IMAGE}
    - buildah push --digestfile ".ci/image-digests/${IMAGE}" "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci"
    - buildah push "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci" "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
    - |
      component=$(printf '%s' "$IMAGE" | tr '[:lower:]-' '[:upper:]_')
      digest=$(cat ".ci/image-digests/${IMAGE}")
      printf 'SHRUNK_%s_TEST_IMAGE=%s/%s:%s-ci@%s\n' "$component" "$CI_REGISTRY_IMAGE" "$IMAGE" "$CI_JOB_ID" "$digest" > ".ci/${IMAGE}.env"
  artifacts:
    reports:
      dotenv: .ci/${IMAGE}.env
    paths:
      - .ci/image-digests/

backend-test:
  extends: .mongo-service
  image:
    name: $SHRUNK_BACKEND_TEST_IMAGE
    entrypoint: [""]
  stage: test
  needs:
    - job: build
      parallel:
        matrix:
          - IMAGE: backend
  script:
    - set -a
    - . .env.example
    - set +a
    - export SHRUNK_DB_HOST=mongo
    - export SHRUNK_DB_NAME=shrunk_test
    - export SHRUNK_DB_PORT=27017
    - export SHRUNK_FLASK_TESTING=1
    - export SHRUNK_DEV_LOGINS=1
    - export SHRUNK_SECRET_KEY=isolated-ci-session-key
    - export SHRUNK_GOOGLE_SAFEBROWSE_ENABLED=1
    - export SHRUNK_GOOGLE_SAFEBROWSE_API_KEY=$GOOGLE_SAFE_BROWSING_API
    - export SHRUNK_REPLICA_SET_NAME="rs0"
    - pytest --junitxml=pytest.xml backend/tests
    - cp .ci/image-digests/backend .ci/backend-tested
  artifacts:
    reports:
      junit: pytest.xml
    paths:
      - .ci/backend-tested

frontend-test:
  stage: test
  image: node:26.13.0-trixie@sha256:6c6f2679f5b655c7c6091a34b81372b5962ca9f25d897a501d613742f922567b
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test

.accessibility-test:
  extends: .mongo-service
  stage: test
  image: docker.io/timbru31/node-chrome@sha256:8bf8949f7f14851e274a6ef7d3e214b6a6610c57fc7cc31635521879aa00a5f4
  when: on_success
  allow_failure: false
  variables:
    FF_NETWORK_PER_BUILD: true
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    PA11Y_URL: frontend:4343
    SHRUNK_DB_HOST: mongo
    SHRUNK_DB_PORT: 27017
    SHRUNK_DB_NAME: shrunk_test
    SHRUNK_REPLICA_SET_NAME: rs0
    SHRUNK_FLASK_TESTING: 1
    SHRUNK_DEV_LOGINS: 1
    SHRUNK_SEED_DATABASE: 1
    SHRUNK_SECRET_KEY: something_secret
    FLASK_DEBUG: false
    FLASK_APP: shrunk
  services:
    - *mongo_service
    - name: $SHRUNK_FRONTEND_TEST_IMAGE
      alias: frontend
    - name: $SHRUNK_BACKEND_TEST_IMAGE
      alias: backend
  script: 
    - mkdir workspace
    - npm ci --prefix frontend/pa11y-ci --omit=dev --ignore-scripts
    - PA11Y_THEME=${THEME} sh frontend/pa11y-ci/entrypoint.sh --config frontend/pa11y-ci/.pa11yci.js
    - mkdir -p ".ci/tested-${THEME}"
    - cp .ci/image-digests/frontend .ci/image-digests/backend ".ci/tested-${THEME}/"
  artifacts:
    when: always
    reports:
      accessibility: workspace/accessibility-${THEME}.json
    paths:
      - workspace/accessibility-${THEME}.json

accessibility-test:
  extends: .accessibility-test
  artifacts:
    paths:
      - workspace/accessibility-${THEME}.json
      - .ci/tested-${THEME}/
  parallel:
    matrix:
      - THEME: light
      - THEME: dark

accessibility-needs-review:
  extends: .accessibility-test
  allow_failure: true
  variables:
    PA11Y_RAW: "1"
  parallel:
    matrix:
      - THEME: light
      - THEME: dark
  artifacts:
    when: always
    reports:
      accessibility: workspace/accessibility-needs-review-${THEME}.json
    paths:
      - workspace/accessibility-needs-review-${THEME}.json

promote-build:
  extends:
    - .skopeo
    - .images
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - skopeo copy "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
                  "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_PIPELINE_IID}-build"

promote-prod:
  extends:
    - .skopeo
    - .images
  rules:
  - if: $CI_COMMIT_TAG
  script:
    - skopeo copy "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
                  "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_TAG}"

promote-milestone:
  extends: .skopeo
  resource_group: shrunk-milestone-images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $SHRUNK_DEV_TRACKING_BRANCH && $CI_COMMIT_BRANCH == $SHRUNK_DEV_TRACKING_BRANCH'
  script:
    - |
      set -eu
      printf '%s\n' "$CI_COMMIT_BRANCH" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      release_tag="${CI_COMMIT_BRANCH}-build-${CI_PIPELINE_IID}"
      test -s .ci/backend-tested
      test "$(cat .ci/image-digests/backend)" = "$(cat .ci/backend-tested)"
      for theme in light dark; do
        for component in frontend backend; do
          test -s ".ci/tested-${theme}/${component}"
          test "$(cat ".ci/image-digests/${component}")" = "$(cat ".ci/tested-${theme}/${component}")"
        done
      done
      for component in frontend backend; do
        repository="${CI_REGISTRY_IMAGE}/${component}"
        digest=$(cat ".ci/image-digests/${component}")
        skopeo list-tags "docker://${repository}" > ".ci/${component}-tags.json"
        if grep -Fq "\"${release_tag}\"" ".ci/${component}-tags.json"; then
          existing=$(skopeo inspect --format '{{.Digest}}' "docker://${repository}:${release_tag}")
          test "$existing" = "$digest" || {
            echo "Refusing to overwrite ${component}:${release_tag}" >&2
            exit 1
          }
        else
          skopeo copy --preserve-digests "docker://${repository}@${digest}" "docker://${repository}:${release_tag}"
        fi
        published=$(skopeo inspect --format '{{.Digest}}' "docker://${repository}:${release_tag}")
        test "$published" = "$digest"
      done
