stages:
  - lint
  - build
  - test
  - promote

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/.npm/
    - .cache/pip

.images:
  parallel:
    matrix:
      - IMAGE: ["frontend", "backend", "shib-sp"]

.buildah:
  image: quay.io/buildah/stable
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" --password $CI_REGISTRY_PASSWORD $CI_REGISTRY

.skopeo:
  image:
    name: quay.io/skopeo/stable
    entrypoint: [""]
  stage: promote
  before_script:
    - skopeo login -u "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.mongo-service:
  services:
    - &mongo_service
      name: mongo:7
      alias: mongo
      command:
        - sh
        - -c
        - |
          replicaset() {
            while ! mongosh --eval 'db.version()' >/dev/null 2>/dev/null; do
              echo "mongo not ready... waiting..."
              sleep 1
            done
            echo "mongo version $(mongosh --eval 'db.version()') is ready..."
            echo "creating mongo replica set..."
            mongosh --eval 'rs.initiate()'
            mongosh --eval 'rs.conf()'
          }

          replicaset &
          exec mongod --bind_ip_all --replSet=rs0

eslint:
  stage: lint
  image: node:latest
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx eslint --format=junit src > ../eslint.xml
  artifacts:
    reports:
      junit: eslint.xml

type-check:
  stage: lint
  image: node:latest
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run type-check

pylint:
  stage: lint
  image: python:3.14
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run pylint --exit-zero --output-format=junit shrunk tests/*.py > pylint.xml
  artifacts:
    reports:
      junit: backend/pylint.xml

mypy:
  # stage: lint
  when: manual
  image: python:3.14
  script:
    - cd backend
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run mypy --junit-xml=./mypy.xml .
  artifacts:
    reports:
      junit: mypy.xml

ruff-lint:
  stage: lint
  image: python:3.14
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run ruff check

ruff-format:
  stage: lint
  image: python:3.14
  script:
    - apt-get update
    - apt-get install -y gcc libldap-common libldap2-dev libsasl2-dev
    - cd backend
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run ruff format --check

prettier:
  stage: lint
  image: node:latest
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx prettier --check .
  
build:
  extends:
    - .buildah
    - .images
  stage: build
  script:
    - mkdir -p .ci/image-digests
    - buildah build -t "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci"
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}"
        --label "edu.rutgers.shrunk.pipeline-iid=${CI_PIPELINE_IID}" ${IMAGE}
    - buildah push --digestfile ".ci/image-digests/${IMAGE}" "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci"
    - buildah push "$CI_REGISTRY_IMAGE/${IMAGE}:${CI_JOB_ID}-ci" "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
    - |
      component=$(printf '%s' "$IMAGE" | tr '[:lower:]-' '[:upper:]_')
      digest=$(cat ".ci/image-digests/${IMAGE}")
      printf 'SHRUNK_%s_TEST_IMAGE=%s/%s:%s-ci@%s\n' "$component" "$CI_REGISTRY_IMAGE" "$IMAGE" "$CI_JOB_ID" "$digest" > ".ci/${IMAGE}.env"
  artifacts:
    reports:
      dotenv: .ci/${IMAGE}.env
    paths:
      - .ci/image-digests/

backend-test:
  extends: .mongo-service
  image:
    name: $SHRUNK_BACKEND_TEST_IMAGE
    entrypoint: [""]
  stage: test
  needs:
    - job: build
      parallel:
        matrix:
          - IMAGE: backend
  script:
    - set -a
    - . .env.example
    - set +a
    - export SHRUNK_DB_HOST=mongo
    - export SHRUNK_DB_NAME=shrunk_test
    - export SHRUNK_DB_PORT=27017
    - export SHRUNK_FLASK_TESTING=1
    - export SHRUNK_GOOGLE_SAFEBROWSE_ENABLED=1
    - export SHRUNK_GOOGLE_SAFEBROWSE_API_KEY=$GOOGLE_SAFE_BROWSING_API
    - export SHRUNK_REPLICA_SET_NAME="rs0"
    - pytest --junitxml=pytest.xml backend/tests
    - cp .ci/image-digests/backend .ci/backend-tested
  artifacts:
    reports:
      junit: pytest.xml
    paths:
      - .ci/backend-tested

frontend-test:
  stage: test
  image: node:latest
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test

.accessibility-test:
  extends: .mongo-service
  stage: test
  image: docker.io/timbru31/node-chrome@sha256:8bf8949f7f14851e274a6ef7d3e214b6a6610c57fc7cc31635521879aa00a5f4
  when: on_success
  allow_failure: false
  variables:
    FF_NETWORK_PER_BUILD: true
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    PA11Y_URL: frontend:4343
    SHRUNK_DB_HOST: mongo
    SHRUNK_DB_PORT: 27017
    SHRUNK_DB_NAME: shrunk_test
    SHRUNK_REPLICA_SET_NAME: rs0
    SHRUNK_DEV_LOGINS: 1
    SHRUNK_SEED_DATABASE: 1
    SHRUNK_SECRET_KEY: something_secret
    FLASK_DEBUG: false
    FLASK_APP: shrunk
  services:
    - *mongo_service
    - name: $SHRUNK_FRONTEND_TEST_IMAGE
      alias: frontend
    - name: $SHRUNK_BACKEND_TEST_IMAGE
      alias: backend
  script: 
    - mkdir workspace
    - npm ci --prefix frontend/pa11y-ci --omit=dev --ignore-scripts
    - PA11Y_THEME=${THEME} sh frontend/pa11y-ci/entrypoint.sh --config frontend/pa11y-ci/.pa11yci.js
    - mkdir -p ".ci/tested-${THEME}"
    - cp .ci/image-digests/frontend .ci/image-digests/backend ".ci/tested-${THEME}/"
  artifacts:
    when: always
    reports:
      accessibility: workspace/accessibility-${THEME}.json
    paths:
      - workspace/accessibility-${THEME}.json

accessibility-test:
  extends: .accessibility-test
  artifacts:
    paths:
      - workspace/accessibility-${THEME}.json
      - .ci/tested-${THEME}/
  parallel:
    matrix:
      - THEME: light
      - THEME: dark

accessibility-needs-review:
  extends: .accessibility-test
  allow_failure: true
  variables:
    PA11Y_RAW: "1"
  parallel:
    matrix:
      - THEME: light
      - THEME: dark
  artifacts:
    when: always
    reports:
      accessibility: workspace/accessibility-needs-review-${THEME}.json
    paths:
      - workspace/accessibility-needs-review-${THEME}.json

promote-build:
  extends:
    - .skopeo
    - .images
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - skopeo copy "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
                  "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_PIPELINE_IID}-build"

promote-prod:
  extends:
    - .skopeo
    - .images
  rules:
  - if: $CI_COMMIT_TAG
  script:
    - skopeo copy "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_SHA}"
                  "docker://$CI_REGISTRY_IMAGE/${IMAGE}:${CI_COMMIT_TAG}"

promote-milestone:
  extends: .skopeo
  resource_group: shrunk-milestone-images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $SHRUNK_DEV_TRACKING_BRANCH && $CI_COMMIT_BRANCH == $SHRUNK_DEV_TRACKING_BRANCH'
  script:
    - |
      set -eu
      printf '%s\n' "$CI_COMMIT_BRANCH" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      release_tag="${CI_COMMIT_BRANCH}-build-${CI_PIPELINE_IID}"
      test -s .ci/backend-tested
      test "$(cat .ci/image-digests/backend)" = "$(cat .ci/backend-tested)"
      for theme in light dark; do
        for component in frontend backend; do
          test -s ".ci/tested-${theme}/${component}"
          test "$(cat ".ci/image-digests/${component}")" = "$(cat ".ci/tested-${theme}/${component}")"
        done
      done
      for component in frontend backend; do
        repository="${CI_REGISTRY_IMAGE}/${component}"
        digest=$(cat ".ci/image-digests/${component}")
        skopeo list-tags "docker://${repository}" > ".ci/${component}-tags.json"
        if grep -Fq "\"${release_tag}\"" ".ci/${component}-tags.json"; then
          existing=$(skopeo inspect --format '{{.Digest}}' "docker://${repository}:${release_tag}")
          test "$existing" = "$digest" || {
            echo "Refusing to overwrite ${component}:${release_tag}" >&2
            exit 1
          }
        else
          skopeo copy --preserve-digests "docker://${repository}@${digest}" "docker://${repository}:${release_tag}"
        fi
        published=$(skopeo inspect --format '{{.Digest}}' "docker://${repository}:${release_tag}")
        test "$published" = "$digest"
      done
