services:
  backend:
    build: ./backend
    command: uv run python3 -m flask run --host=0.0.0.0 -p 3050
    volumes:
      - ./development.env:/usr/shrunk/backend/.env
      - ./backend:/usr/shrunk/backend
      - backend_venv:/usr/shrunk/backend/.venv
    env_file:
      - ./development.env
    depends_on:
      - mongodb0
      - mongodb1
      - mongodb2
      - httpd
    networks:
      - mongo-net
      - proxy-net

  frontend:
    build: ./frontend
    volumes:
      - ./development.env:/usr/shrunk/frontend/.env
      - ./frontend:/usr/shrunk/frontend
    env_file:
      - ./development.env
    depends_on:
      - httpd
    networks:
      - proxy-net

  httpd:
    image: httpd:2.4
    stdin_open: true
    tty: true
    ports:
      - "4343:4343"
    volumes:
      - ./httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./httpd:/usr/local/apache2/logs
    networks:
      - proxy-net

  mongodb0:
    build: ./database
    environment:
      - PRIMARY=1
    networks:
      - mongo-net

  mongodb1:
    build: ./database
    networks:
      - mongo-net

  mongodb2:
    build: ./database
    networks:
      - mongo-net

networks:
  mongo-net:
    driver: bridge
    attachable: true
  proxy-net:
    driver: bridge
    attachable: true
