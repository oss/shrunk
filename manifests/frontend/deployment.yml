apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oit-eas-macs-shrunk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shrunk
      tier: frontend
  template:
    metadata:
      labels:
        app: shrunk
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ei-quay-quay-quay-enterprise.apps.ocp.ei.rutgers.edu/openshift_oit-eas-macs-shrunk/frontend:latest
          envFrom:
            - configMapRef:
                name: configfile
          volumeMounts:
            - name: logs
              mountPath: /usr/local/apache2/logs
            - name: shib-socket
              mountPath: /var/run/shibboleth/
            - name: shib-config
              mountPath: /etc/shibboleth/shibboleth2.xml
              subPath: shibboleth2.xml
              readOnly: true
          imagePullPolicy: Always
          ports:
            - containerPort: 4343
              protocol: TCP
      initContainers:
        - name: shib-sp
          image: ei-quay-quay-quay-enterprise.apps.ocp.ei.rutgers.edu/openshift_oit-eas-macs-shrunk/shib-sp:latest
          imagePullPolicy: Always
          # Setting restartPolicy: Always makes this a sidecar container.
          restartPolicy: Always
          volumeMounts:
            - name: shib-socket
              mountPath: /var/run/shibboleth/
            - name: shib-config
              mountPath: /etc/shibconfig
              readOnly: true
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: apache-logs
        - name: shib-socket
          emptyDir: {}
        - name: shib-config
          secret:
            secretName: shibfiles
          
